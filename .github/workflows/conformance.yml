name: Conformance

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
  workflow_dispatch:

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The host checks are skipped on a runner -- no terminal is checked out
      # there -- so this gate covers the manifests and the preset joins. The
      # host sync is checked on the machine that has the hosts.
      - run: npm test

name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified root artifact
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # The site renders the repo's own files, and one of the pages it renders is
  # the conformance result. Publishing a site that reports a passing suite
  # without having run it would be the one lie this repo cannot afford.
  verify:
    uses: ./.github/workflows/conformance.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: node check.mjs
      - run: mv dist dist-root
      - run: LINTEL_BASE_PATH=/lintel npm run build
      - run: LINTEL_BASE_PATH=/lintel node check.mjs
      - run: rm -rf dist && mv dist-root dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.publish
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Verify root artifact binding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          domain=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.cname // ""')
          if [ "$domain" != "lintel.aylith.com" ]; then
            echo "::error::Root publication requires the configured lintel.aylith.com Pages binding"
            exit 1
          fi
      - id: deployment
        uses: actions/deploy-pages@v4
